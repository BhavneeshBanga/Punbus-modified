<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
    <!-- Background -->
    <circle cx="256" cy="256" r="256" fill="#1A935A"/>

    <!-- Radar Dome Shadow -->
    <ellipse cx="256" cy="300" rx="110" ry="30" fill="#0F5F3A" opacity="0.25"/>

    <!-- Radar Concentric Rings -->
    <g fill="none" stroke="#84DBFF" stroke-width="3" opacity="0.6">
        <circle cx="256" cy="256" r="110"/>
        <circle cx="256" cy="256" r="80" stroke-dasharray="6,6"/>
        <circle cx="256" cy="256" r="50" stroke-dasharray="4,5"/>
    </g>

    <!-- Radar Grid Crosshairs -->
    <line x1="146" y1="256" x2="366" y2="256" stroke="#54C0EB" stroke-width="2" opacity="0.4"/>
    <line x1="256" y1="146" x2="256" y2="366" stroke="#54C0EB" stroke-width="2" opacity="0.4"/>

    <!-- Bus 1 (center) -->
    <g transform="translate(226, 226)">
        <rect width="60" height="60" rx="12" fill="#F7941D"/>
        <rect x="10" y="10" width="40" height="12" rx="2" fill="#FFFFFF"/>
        <circle cx="12" cy="45" r="5" fill="#FFFFFF"/>
        <circle cx="48" cy="45" r="5" fill="#FFFFFF"/>
    </g>

    <!-- Bus 2 (top-left) -->
    <g transform="translate(160, 170) scale(0.85)">
        <rect width="60" height="60" rx="12" fill="#F7941D"/>
        <rect x="10" y="10" width="40" height="12" rx="2" fill="#FFFFFF"/>
        <circle cx="12" cy="45" r="5" fill="#FFFFFF"/>
        <circle cx="48" cy="45" r="5" fill="#FFFFFF"/>
    </g>

    <!-- Bus 3 (bottom-right) -->
    <g transform="translate(300, 300) scale(0.85)">
        <rect width="60" height="60" rx="12" fill="#F7941D"/>
        <rect x="10" y="10" width="40" height="12" rx="2" fill="#FFFFFF"/>
        <circle cx="12" cy="45" r="5" fill="#FFFFFF"/>
        <circle cx="48" cy="45" r="5" fill="#FFFFFF"/>
    </g>

    <!-- Radar Highlight Ring -->
    <ellipse cx="256" cy="256" rx="110" ry="38" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.08"/>

    <!-- Motion Waves -->
    <g stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.4">
        <path d="M190 190 q-20 -20 -40 0"/>
        <path d="M322 190 q20 -20 40 0"/>
        <path d="M190 322 q-20 20 -40 0"/>
        <path d="M322 322 q20 20 40 0"/>
    </g>

    <!-- Faint Glow Pulse -->
    <circle cx="256" cy="256" r="130" fill="#84DBFF" opacity="0.04"/>
</svg>
